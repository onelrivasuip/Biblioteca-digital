{% extends "base.html" %}

{% block titulo %}Editar libro — Biblioteca Central{% endblock %}

{% block contenido %}

<section class="panel">

    <h2>Editar libro</h2>

    <form
        class="formulario"
        method="post"
        action="{{ url_for('libros.editar', libro_id=libro.id) }}"
    >

        <div class="campos">
            <input
                type="text"
                name="titulo"
                placeholder="Título"
                value="{{ libro.titulo }}"
                required
            >

            <input
                type="text"
                name="autor"
                placeholder="Autor"
                value="{{ libro.autor }}"
                required
            >

            <input
                type="text"
                name="isbn"
                placeholder="ISBN"
                value="{{ libro.isbn }}"
                required
            >

            <input
                type="text"
                name="categoria"
                placeholder="Categoría (opcional)"
                value="{{ libro.categoria or '' }}"
            >
        </div>

        <button class="boton-principal" type="submit">Guardar cambios</button>
        <a class="boton-secundario" href="{{ url_for('libros.index') }}">Cancelar</a>

    </form>

</section>

{% endblock %}
