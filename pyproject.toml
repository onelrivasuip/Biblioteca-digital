[project]
name = "biblioteca-digital"
version = "0.1.0"
description = "Sistema de gestión de biblioteca (libros, clientes, préstamos y multas) con Flask y MySQL."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Equipo Biblioteca Digital" }
]
dependencies = [
    "Flask>=3.1,<4",
    "mysql-connector-python>=26.7,<27",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
